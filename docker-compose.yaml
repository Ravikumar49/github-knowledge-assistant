version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gka-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: gka_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gka-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  qdrant:
    image: qdrant/qdrant:latest
    container_name: gka-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
      build:
        context: .
        dockerfile: apps/api/Dockerfile
      container_name: gka-api
      ports:
        - "4000:4000"
      environment:
        - PORT=4000
        - REDIS_URL=redis://gka-redis:6379
        - QDRANT_URL=http://gka-qdrant:6333
        - DATABASE_URL=postgresql://postgres:password123@gka-postgres:5432/gka_db
        - GEMINI_API_KEY=${GEMINI_API_KEY}
      depends_on:
        postgres:
          condition: service_healthy
        redis:
          condition: service_started
        qdrant:
          condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: gka-worker
    environment:
      - REDIS_URL=redis://gka-redis:6379
      - QDRANT_URL=http://gka-qdrant:6333
      - DATABASE_URL=postgresql://postgres:password123@gka-postgres:5432/gka_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  qdrant_data: